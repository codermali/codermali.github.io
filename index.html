<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>马力 — AI 驱动的全栈工程师</title>
<meta name="description" content="马力的个人主页：AI 驱动的全栈工程师，习惯把想法自己做到上线，正在尝试用 AI 做更多的事。">
<style>
:root{
  --bg:#0a0a0a;
  --text:#909090;
  --head:#f0f0f0;
  --accent:#60a5fa;
  --chip-bg:rgba(96,165,250,.1);
  --card-hover:rgba(255,255,255,.045);
  --line:rgba(144,144,144,.18);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent);color:var(--bg)}
a{color:inherit;text-decoration:none}

/* 鼠标聚光灯 */
#spot{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px at 50% 30%,rgba(96,165,250,.07),transparent 80%);
}

.layout{
  position:relative;z-index:1;
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;
}

/* ===== 左栏 ===== */
.side{
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:96px 0;
}
.side h1{color:var(--head);font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.side .role{color:var(--head);font-size:19px;font-weight:500;margin-top:14px}
.side .tagline{margin-top:14px;max-width:340px;font-size:15.5px}
nav{margin-top:56px}
nav a{
  display:flex;align-items:center;gap:14px;
  padding:10px 0;font-size:12.5px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--text);
}
nav a .bar{
  width:32px;height:1px;background:var(--text);
  transition:all .25s ease;
}
nav a:hover,nav a.active{color:var(--head)}
nav a:hover .bar,nav a.active .bar{width:64px;background:var(--head)}
.social{display:flex;gap:20px;align-items:center}
.social a{color:var(--text);transition:color .2s,transform .2s;display:block}
.social a:hover{color:var(--accent);transform:translateY(-2px)}
.social svg{width:22px;height:22px;fill:currentColor}

/* ===== 右栏 ===== */
.main{padding:96px 0;min-height:100vh;display:flex;flex-direction:column}
section{margin-bottom:96px;scroll-margin-top:96px}
section:last-child{margin-bottom:48px}
.sec-title{
  display:none;
  color:var(--head);font-size:13px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;margin-bottom:24px;
}
.about p{margin-bottom:16px;font-size:16px}
.about a,.credit a{color:var(--accent)}
.about a:hover,.credit a:hover{text-decoration:underline}
.about b{color:var(--head);font-weight:500}

/* 项目/链接卡片 */
.card{
  display:grid;grid-template-columns:auto 1fr;gap:4px 20px;
  padding:20px;border-radius:8px;margin-bottom:12px;
  border:1px solid transparent;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.card:hover{
  background:var(--card-hover);border-color:var(--line);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.card:hover h3{color:var(--accent)}
.card:hover .arrow{transform:translate(4px,-4px)}
.card .when{
  grid-row:1/span 3;
  font-size:12px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;color:var(--text);opacity:.75;
  padding-top:5px;min-width:84px;
}
.card h3{
  color:var(--head);font-size:16.5px;font-weight:500;
  display:flex;align-items:center;gap:8px;
}
.card .arrow{
  display:inline-block;font-size:14px;color:var(--head);
  transition:transform .2s ease;
}
.card:hover .arrow{color:var(--accent)}
.card p{font-size:14.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{
  background:var(--chip-bg);color:var(--accent);
  font-size:12.5px;font-weight:500;
  padding:4px 12px;border-radius:999px;
}

/* 联系 */
.contact-row{display:flex;gap:40px;flex-wrap:wrap;align-items:flex-start}
.contact-list{flex:1;min-width:240px}
.contact-list .item{margin-bottom:18px}
.contact-list .k{
  font-size:12px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:2px;
}
.contact-list .v a{color:var(--head);font-size:16px}
.contact-list .v a:hover{color:var(--accent)}
.qr-card{
  border:1px solid var(--line);border-radius:8px;
  padding:16px;text-align:center;width:180px;
}
.qr-card .k{
  font-size:12px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:12px;
}
.qr{
  width:100%;aspect-ratio:1;border-radius:6px;
  background:rgba(148,163,184,.06);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1.6;padding:12px;color:var(--text);
}
.qr img{width:100%;height:100%;object-fit:contain;border-radius:5px}
.qr-card .d{font-size:12.5px;margin-top:10px}

.credit{font-size:13px;line-height:1.9;color:var(--text);opacity:.85;margin-top:auto}

/* ===== 响应式 ===== */
@media(max-width:900px){
  .layout{display:block;padding:0 24px}
  .side{position:static;height:auto;padding:64px 0 0}
  nav{display:none}
  .social{margin-top:32px}
  .main{padding:56px 0;min-height:0}
  section{margin-bottom:64px}
  .sec-title{display:block}
  .card{grid-template-columns:1fr;padding:16px 0}
  .card .when{grid-row:auto;padding:0;margin-bottom:2px}
  .card:hover{background:none;border-color:transparent;box-shadow:none}
}
</style>
</head>
<body>
<div id="spot"></div>
<div class="layout">

  <!-- 左栏：名片 -->
  <header class="side">
    <div>
      <h1><a href="/">马力</a></h1>
      <p class="role">AI 驱动的全栈工程师</p>
      <p class="tagline">新时代，新挑战。一个普通牛马在 AI 时代，踏上新的征程。</p>
      <nav id="nav">
        <a href="#about" class="active"><span class="bar"></span>关于</a>

      </a>
      <a href="https://blog.codermali.com" target="_blank" rel="noreferrer" aria-label="博客" title="博客">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16v-2H4v2ZM18.7 3.3a2.1 2.1 0 0 0-3 0L5.5 13.5 5 17l3.5-.5L18.7 6.3a2.1 2.1 0 0 0 0-3Z"/></svg>

      </a>
    </div>
  </header>

  <!-- 右栏：内容 -->
  <main class="main">

    <section id="about" class="about">
      <h2 class="sec-title">关于</h2>
      <p>十年资深开发，产品经理，全栈工程师。这些统统作废。</p>
      <p>AI 时代，一个传统的开发应该如何自处？</p>

        <div class="contact-list">
          <div class="item">

    <footer class="credit">
      <p>© 2016-2026 mali　·　<a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">粤ICP备18133668号-1</a></p>

</div>

<script>
// 鼠标聚光灯
const spot = document.getElementById('spot');
window.addEventListener('mousemove', e => {
  spot.style.background =
    `radial-gradient(600px at ${e.clientX}px ${e.clientY}px, rgba(96,165,250,.07), transparent 80%)`;
});

// 滚动高亮导航
const links = document.querySelectorAll('#nav a');
const secs = [...links].map(a => document.querySelector(a.getAttribute('href')));
const io = new IntersectionObserver(es => {
  es.forEach(en => {
    if (en.isIntersecting) {
      links.forEach(a => a.classList.toggle('active',
        a.getAttribute('href') === '#' + en.target.id));
    }
  });
}, {rootMargin: '-40% 0px -55% 0px'});
secs.forEach(s => s && io.observe(s));
</script>
</body>
